<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("div.sourceCode[data-highlight-lines]").forEach(function (block) {
    var lines = block.querySelectorAll("pre > code > span");
    var spoken = [];
    var count = 0;

    block.getAttribute("data-highlight-lines").split(/[,|]/).forEach(function (range) {
      var bounds = range.split("-");
      var first = parseInt(bounds[0], 10);
      var last = Math.min(parseInt(bounds[bounds.length - 1], 10), lines.length);
      if (isNaN(first) || isNaN(last) || first > last) {
        return;
      }
      for (var n = first; n <= last; n++) {
        lines[n - 1].classList.add("highlight-line");
        count++;
      }
      spoken.push(first === last ? String(first) : first + " to " + last);
    });

    // Screen readers get the highlighted line numbers, since the highlight itself is visual
    if (count > 0) {
      var note = document.createElement("p");
      note.className = "visually-hidden";
      note.textContent = (count === 1 ? "Highlighted line " : "Highlighted lines ") + spoken.join(", ");
      block.insertBefore(note, block.firstChild);
    }
  });
});
</script>
